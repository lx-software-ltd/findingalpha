# Checkov configuration for the findingalpha CDK app.
# https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html
#
# Global skips live here. Per-resource skips are metadata from
# lib/constructs/checkov-suppressions.ts. The security workflow drops
# SARIF findings whose only suppression is kind == "inSource".

framework:
  - cloudformation

soft-fail: true
compact: true
download-external-modules: false

skip-check:
  # Access-log destination buckets cannot log to themselves.
  - CKV_AWS_18
  # WAF is optional. WafWebAclArn attaches an existing web ACL when set.
  - CKV_AWS_68
