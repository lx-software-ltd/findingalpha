name: Lighthouse Public Website
# template:set
# The logo site build needs no production variables, so one job covers a
# path-filtered pull request, the Monday run, and a manual run. It is not
# a required check. main-protection still requires lint, test, and
# security-summary.
# template:end

on:
  workflow_dispatch:
    inputs:
      page_paths:
        # template:set
        description: "Comma/newline-separated page paths or full URLs to audit (e.g. /)"
        # template:end
        required: false
        # template:set
        default: "/"
        # template:end
  pull_request:
    paths:
      - "apps/public_www/**"
      - ".github/workflows/lighthouse-public-www.yml"
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

concurrency:
  group: lighthouse-public-www-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    permissions:
      contents: read
      statuses: write
    name: Lighthouse audit


    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # template:set
        # template:end


      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www


      - name: Build public website
        working-directory: apps/public_www
        # template:set
        # template:end
        run: npm run build

      - name: Run Lighthouse CI
        uses: lx-software-ltd/actions/lighthouse-ci@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: apps/public_www
          page-paths: ${{ inputs.page_paths }}
          # template:set
          default-paths: /
          # template:end
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-public-www-results
          path: apps/public_www/.lighthouseci/**
          if-no-files-found: warn
          include-hidden-files: true
