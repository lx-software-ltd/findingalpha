name: Deploy Admin Web

on:
  push:
    branches: [main]
    paths:
      - "apps/admin_web/**"
      - "contracts/roadmap.json"
      - ".github/workflows/deploy-admin-web.yml"
  workflow_dispatch:
  # A backend deploy can replace the Cognito client or the HTTP API. Rebuild
  # the SPA from current main so it picks up those outputs. Only a successful
  # Deploy Backend on main qualifies. The SPA is added in M03; until then the
  # job skips the build.
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip when the app does not exist yet
        id: exists
        run: test -f apps/admin_web/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        id: aws
        if: steps.exists.outputs.present == 'true'
        uses: lx-software-ltd/actions/aws-oidc@daa2fd06bb4a9580a3d3302f9127a66da39d940e # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - run: npm ci
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        working-directory: apps/admin_web

      - name: Read admin SPA settings from the findingalpha stack
        id: stack_outputs
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/cfn-stack-outputs@daa2fd06bb4a9580a3d3302f9127a66da39d940e # main 2026-11-23
        with:
          stack: findingalpha
          outputs: UserPoolClientId CognitoDomain AdminApiBaseUrl
          region: ${{ vars.AWS_REGION }}

      - name: Check admin SPA settings
        id: admin_spa
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        env:
          JSON: ${{ steps.stack_outputs.outputs.json }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["JSON"])
          domain = data["CognitoDomain"]
          api_url = data["AdminApiBaseUrl"]
          client_id = data["UserPoolClientId"]
          if not domain.startswith("https://"):
              print("::error::CognitoDomain on findingalpha must be an https origin", file=sys.stderr)
              sys.exit(1)
          if not api_url.startswith("https://"):
              print("::error::AdminApiBaseUrl on findingalpha must be an https origin", file=sys.stderr)
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"client_id={client_id}\n")
              handle.write(f"domain={domain}\n")
              handle.write(f"api_url={api_url}\n")
          PY

      - run: npm run build
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: ${{ steps.admin_spa.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.admin_spa.outputs.domain }}
          VITE_COGNITO_REDIRECT_URI: https://${{ vars.ADMIN_WEB_DOMAIN_NAME }}/auth/callback
          VITE_COGNITO_LOGOUT_URI: https://${{ vars.ADMIN_WEB_DOMAIN_NAME }}/
          VITE_API_BASE_URL: ${{ steps.admin_spa.outputs.api_url }}

      - name: Read the admin website outputs
        id: site
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=findingalpha-admin-web
          bucket="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='AdminWebBucketName'].OutputValue" --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='AdminWebDistributionId'].OutputValue" --output text)"
          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "Admin web bucket output not found for $stack" >&2
            exit 1
          fi
          if [ "$distribution" = "None" ]; then
            distribution=""
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"

      - name: Upload the admin site
        if: steps.exists.outputs.present == 'true' && steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@daa2fd06bb4a9580a3d3302f9127a66da39d940e # main 2026-11-23
        with:
          source: apps/admin_web/dist
          bucket: ${{ steps.site.outputs.bucket }}
          distribution-id: ${{ steps.site.outputs.distribution }}
          profile: admin-hashed
          dry-run: "false"
