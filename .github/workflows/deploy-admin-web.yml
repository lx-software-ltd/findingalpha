name: Deploy Admin Web

on:
  push:
    branches: [main]
    paths:
      - "apps/admin_web/**"
      - "scripts/deploy/deploy-admin-www.sh"
      - "contracts/roadmap.json"
      - ".github/workflows/deploy-admin-web.yml"
  workflow_dispatch:
  # A backend deploy can replace the Cognito client or the HTTP API. Rebuild
  # the SPA from current main so it picks up those outputs. Only a successful
  # Deploy Backend on main qualifies. The SPA is added in M03; until then the
  # job skips the build.
  workflow_run:
    workflows: ["Deploy Backend"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip when the app does not exist yet
        id: exists
        run: test -f apps/admin_web/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Require the account id
        if: steps.exists.outputs.present == 'true'
        env:
          P_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "${P_ACCOUNT_ID}" ]; then
            echo "::add-mask::${P_ACCOUNT_ID}"
          fi
          if [ -z "${P_ACCOUNT_ID}" ]; then
            echo "::error::Set AWS_ACCOUNT_ID as a repository secret or a variable before deploying."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.exists.outputs.present == 'true'
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - run: npm ci
        if: steps.exists.outputs.present == 'true'
        working-directory: apps/admin_web

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        if: steps.exists.outputs.present == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read admin SPA settings from the findingalpha stack
        id: admin_spa
        if: steps.exists.outputs.present == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          stack=findingalpha
          err="$(mktemp)"
          if ! json="$(aws cloudformation describe-stacks --stack-name "$stack" --output json 2>"$err")"; then
            if grep -q 'AccessDenied' "$err"; then
              echo "::error::GitHubActionsRole needs cloudformation:DescribeStacks on stack ${stack} in ${AWS_REGION}."
            fi
            cat "$err" >&2
            rm -f "$err"
            exit 1
          fi
          rm -f "$err"
          read_output() {
            jq -r --arg key "$1" '
              (.Stacks[0].Outputs // [])[] | select(.OutputKey == $key) | .OutputValue
            ' <<<"$json"
          }
          client_id="$(read_output UserPoolClientId)"
          domain="$(read_output CognitoDomain)"
          api_url="$(read_output AdminApiBaseUrl)"
          if [ -z "$client_id" ] || [ -z "$domain" ] || [ -z "$api_url" ]; then
            echo "::error::Stack $stack is missing UserPoolClientId, CognitoDomain, or AdminApiBaseUrl"
            exit 1
          fi
          case "$domain" in
            https://*) ;;
            *)
              echo "::error::CognitoDomain on $stack must be an https origin"
              exit 1
              ;;
          esac
          case "$api_url" in
            https://*) ;;
            *)
              echo "::error::AdminApiBaseUrl on $stack must be an https origin"
              exit 1
              ;;
          esac
          {
            echo "client_id=$client_id"
            echo "domain=$domain"
            echo "api_url=$api_url"
          } >> "$GITHUB_OUTPUT"

      - run: npm run build
        if: steps.exists.outputs.present == 'true'
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: ${{ steps.admin_spa.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.admin_spa.outputs.domain }}
          VITE_COGNITO_REDIRECT_URI: https://${{ vars.ADMIN_WEB_DOMAIN_NAME }}/auth/callback
          VITE_COGNITO_LOGOUT_URI: https://${{ vars.ADMIN_WEB_DOMAIN_NAME }}/
          VITE_API_BASE_URL: ${{ steps.admin_spa.outputs.api_url }}

      - name: Upload the admin site
        if: steps.exists.outputs.present == 'true'
        run: bash scripts/deploy/deploy-admin-www.sh
        env:
          ADMIN_WEB_STACK_NAME: findingalpha-admin-web
