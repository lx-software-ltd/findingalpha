name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  # No path filter. The `test` job is a required check, and a skipped
  # required check leaves the pull request blocked.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "apps/admin_web/**"
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "contracts/**"
      - "scripts/**"

jobs:
  check-contracts:
    name: Check shared contracts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify contract artifacts
        run: python3 scripts/check-contracts.py

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22

      - name: Test scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  test-python:
    name: Test Python
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"
      - run: python3 -m pip install boto3
      - run: |
          for dir in backend/lambda/engine backend/lambda/pre_token_generation backend/lambda/public_api_authorizer; do
            if [ -d "$dir" ]; then
              python3 -m unittest discover -s "$dir" -p 'test_*.py' -v
            fi
          done

  build-public-www:
    name: Build Public Www
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: apps/public_www

      - name: Build public website
        run: npm run build
        working-directory: apps/public_www

      - name: Test public website
        run: npm test
        working-directory: apps/public_www

  build-admin-web:
    name: Build Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: apps/admin_web

      - name: Build admin website
        run: npm run build
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5174/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Install engine test dependencies
        run: python3 -m pip install boto3

      - name: Test admin website
        run: npm test
        working-directory: apps/admin_web
        env:
          VITE_COGNITO_CLIENT_ID: placeholder-client-id
          VITE_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: http://localhost:5174/auth/callback
          VITE_API_BASE_URL: https://placeholder.execute-api.us-east-1.amazonaws.com

  e2e-admin-web:
    name: Admin Web viewport smoke
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: apps/admin_web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin_web

      - name: Run viewport smoke tests
        run: npm run test:e2e
        working-directory: apps/admin_web

  test-infrastructure:
    name: Test Infrastructure
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "lts/*"
          cache: npm
          working-directory: backend/infrastructure

      - name: Build CDK app
        run: npm run build
        working-directory: backend/infrastructure

      - name: Run CDK assertion tests
        run: npm test
        working-directory: backend/infrastructure
        env:
          CI: "true"

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - check-contracts
      - test-python
      - build-public-www
      - build-admin-web
      - e2e-admin-web
      - test-infrastructure
    if: always()
    steps:
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          needs-json: ${{ toJson(needs) }}
