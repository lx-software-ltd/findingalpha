name: Manage Public API Keys

on:
  workflow_dispatch:
    inputs:
      action:
        description: create, list, revoke, set-write, or set-scopes
        required: true
        type: choice
        options:
          - create
          - list
          - revoke
          - set-write
          - set-scopes
      label:
        description: Name for a new key
        required: false
        type: string
      tier:
        description: Only admin can be minted
        required: false
        type: choice
        default: admin
        options:
          - admin
      scopes:
        description: Comma-separated scopes. Empty on create means system. set-scopes replaces the whole list, so repeat every scope to keep
        required: false
        type: string
      allow_write:
        description: Opt the key into writes. The stack switch must also be on
        required: false
        type: boolean
        default: false
      expires_at:
        description: ISO date. Empty means 90 days
        required: false
        type: string
      allowed_cidrs:
        description: Comma-separated CIDRs. Empty allows any address
        required: false
        type: string
      key_id:
        description: keyId for revoke, set-write, or set-scopes
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  keys:
    name: Manage keys
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@ffde04dca3c78b1ccb8739f4d3a23f728ac7a05f # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Require the passphrase before creating a key
        if: inputs.action == 'create'
        env:
          GPG_PASSPHRASE: ${{ secrets.PUBLIC_API_KEY_GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::error::Set PUBLIC_API_KEY_GPG_PASSPHRASE on the production environment before creating a key."
            exit 1
          fi

      - name: Create key
        if: inputs.action == 'create'
        env:
          LABEL: ${{ inputs.label }}
          TIER: ${{ inputs.tier }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          SCOPES: ${{ inputs.scopes }}
          ALLOWED_CIDRS: ${{ inputs.allowed_cidrs }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
          GPG_PASSPHRASE: ${{ secrets.PUBLIC_API_KEY_GPG_PASSPHRASE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp -u)"
          ARGS=(create --label "$LABEL" --tier "$TIER" --plaintext-out "$KEY_FILE" --region "$AWS_REGION")
          if [ -n "$EXPIRES_AT" ]; then
            ARGS+=(--expires-at "$EXPIRES_AT")
          fi
          if [ -n "$SCOPES" ]; then
            ARGS+=(--scopes "$SCOPES")
          fi
          if [ -n "$ALLOWED_CIDRS" ]; then
            ARGS+=(--allowed-cidrs "$ALLOWED_CIDRS")
          fi
          if [ "$ALLOW_WRITE" = "true" ]; then
            ARGS+=(--allow-write)
          fi
          python3 scripts/manage-public-api-keys.py "${ARGS[@]}"
          echo "::add-mask::$(tr -d '\n' < "$KEY_FILE")"
          gpg --batch --yes --symmetric --cipher-algo AES256 --armor \
            --passphrase "$GPG_PASSPHRASE" \
            --output key.asc "$KEY_FILE"
          rm -f "$KEY_FILE"
          {
            echo "## Encrypted API key"
            echo ""
            echo "Copy the block below into \`key.asc\`, then run"
            echo "\`gpg --decrypt key.asc\` and enter the"
            echo "\`PUBLIC_API_KEY_GPG_PASSPHRASE\` value."
            echo ""
            echo '```'
            cat key.asc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f key.asc
          echo "Encrypted key emitted to the job summary."

      - name: List keys
        if: inputs.action == 'list'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py list --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Revoke key
        if: inputs.action == 'revoke'
        env:
          KEY_ID: ${{ inputs.key_id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python3 scripts/manage-public-api-keys.py revoke --key-id "$KEY_ID" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set write
        if: inputs.action == 'set-write'
        env:
          KEY_ID: ${{ inputs.key_id }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          FLAG="--read-only"
          if [ "$ALLOW_WRITE" = "true" ]; then
            FLAG="--allow-write"
          fi
          python3 scripts/manage-public-api-keys.py set-write --key-id "$KEY_ID" "$FLAG" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set scopes
        if: inputs.action == 'set-scopes'
        env:
          KEY_ID: ${{ inputs.key_id }}
          SCOPES: ${{ inputs.scopes }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ID" ] || [ -z "$SCOPES" ]; then
            echo "::error::key_id and scopes are required for set-scopes. Repeat every scope the key should keep."
            exit 1
          fi
          python3 scripts/manage-public-api-keys.py set-scopes --key-id "$KEY_ID" --scopes "$SCOPES" --region "$AWS_REGION" | tee -a "$GITHUB_STEP_SUMMARY"
