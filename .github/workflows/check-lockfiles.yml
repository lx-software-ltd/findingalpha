name: Check Lockfiles

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@e6be2629d7206b0d5c079662f364772bc816acc1 # main 2026-11-23

      - name: Validate brand asset copies
        run: bash scripts/sync-brand-assets.sh --check

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@e6be2629d7206b0d5c079662f364772bc816acc1 # main 2026-11-23
        with:
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure

  python-requirements:
    name: Check Python requirement pins
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@e6be2629d7206b0d5c079662f364772bc816acc1 # main 2026-11-23
        with:
          files: |
            backend/lambda/engine/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt
