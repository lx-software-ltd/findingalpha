name: Deploy Public Website

on:
  repository_dispatch:
    types: [deploy-public-www]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "scripts/deploy/deploy-public-website.sh"
      - ".github/workflows/deploy-public-www.yml"

permissions:
  contents: read

concurrency:
  group: deploy-public-www
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    # The production environment should also limit branches to main.
    # This job refuses every other ref even if that setting is open.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Build public website
        run: npm run build
        working-directory: apps/public_www

      # After the build. npm ci and the build must not see the deploy role.
      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Deploy public website
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          source: apps/public_www/dist
          stack: findingalpha-public-www
          region: ${{ vars.AWS_REGION }}
          bucket-output: PublicWebsiteBucketName
          distribution-output: PublicWebsiteDistributionId
          profile: public-hashed
          dry-run: "false"
