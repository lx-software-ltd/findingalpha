name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
          # Pillow/defusedxml force Docker ARM bundling; Checkov only needs the
          # CloudFormation template, same as CDK Jest (`bundling-stacks: []`).
          CDK_SKIP_PYTHON_PIP: "1"
        run: |
          if [ ! -f package.json ]; then
            echo "CDK app is not created yet; skipping synth."
            mkdir -p cdk.out
            exit 0
          fi
          npx cdk synth --quiet --output cdk.out

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml
          framework: cloudformation

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # javascript-typescript is the analyzed language. The category stays
          # /language:javascript, which is where the existing alerts are filed.
          - language: javascript-typescript
            category: "/language:javascript"
          - language: python
            category: "/language:python"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: lx-software-ltd/actions/setup-python@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          category: ${{ matrix.category }}

  pii-denylist:
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          python-version: "3.12"

      # 22 Nov 2026: ignore-vulns is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when one is ignored.
      - name: Audit Python requirements
        uses: lx-software-ltd/actions/pip-audit@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          requirements: |
            backend/lambda/engine/requirements.txt
            backend/lambda/public_api_authorizer/requirements.txt

  bandit:
    name: Bandit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          python-version: "3.12"

      # Measured 22 Nov 2026. backend/lambda has no high or medium findings.
      # B101 is assert used as a type narrowing. B311 is a seeded Random in a
      # unit test. B105 and B106 are marked on the line they match.
      # scripts/ is not scanned: probe_data_sources.py says it is not part of CI.
      - name: Run Bandit
        uses: lx-software-ltd/actions/bandit@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          paths: backend/lambda
          skip: B101,B311

  npm-audit:
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22

      # 22 Nov 2026: audit-level is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when the level changes.
      - name: Audit npm lockfiles
        uses: lx-software-ltd/actions/npm-audit@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          directories: |
            apps/public_www
            apps/admin_web
            backend/infrastructure

  security-summary:
    name: security-summary
    runs-on: ubuntu-26.04
    needs: [checkov, codeql, pii-denylist, secrets-scan, dependency-audit, bandit, npm-audit]
    if: always()
    steps:
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@12ce7549f74db10a3c595214bf411deba0ef728a # main 2026-11-22
        with:
          needs-json: ${{ toJson(needs) }}
