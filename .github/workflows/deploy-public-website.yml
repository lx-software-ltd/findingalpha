name: Deploy Public Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/public_www/**"
      - "scripts/deploy/deploy-public-website.sh"
      - ".github/workflows/deploy-public-website.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-public-website
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require the account id
        env:
          P_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "${P_ACCOUNT_ID}" ]; then
            echo "::add-mask::${P_ACCOUNT_ID}"
          fi
          if [ -z "${P_ACCOUNT_ID}" ]; then
            echo "::error::Set AWS_ACCOUNT_ID as a repository secret or a variable before deploying."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/public_www/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/public_www

      - name: Build public website
        run: npm run build
        working-directory: apps/public_www

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Deploy public website
        run: bash scripts/deploy/deploy-public-website.sh
        env:
          PUBLIC_WEBSITE_STACK_NAME: findingalpha-public-www
