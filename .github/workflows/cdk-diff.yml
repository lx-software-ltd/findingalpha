name: CDK Diff

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
  workflow_dispatch:
    inputs:
      stacks:
        description: "Optional space/comma-separated CDK stack names"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: cdk-diff
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require the AWS account settings
        id: account
        run: |
          if [ -n "${AWS_ACCOUNT_ID}" ]; then
            echo "::add-mask::${AWS_ACCOUNT_ID}"
          fi
          if [ -z "${AWS_ACCOUNT_ID}" ] || [ -z "${AWS_REGION}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_ACCOUNT_ID or AWS_REGION is unset, so cdk diff did not run."
            {
              echo "### CDK diff did not run"
              echo ""
              echo "Set the repository variables \`AWS_ACCOUNT_ID\` and \`AWS_REGION\`."
              echo "A green result before both are set means the account was not compared."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Set up Node.js
        if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Configure AWS credentials
        if: steps.account.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Install CDK dependencies
        if: steps.account.outputs.ready == 'true'
        run: |
          if [ -f "backend/infrastructure/package.json" ]; then
            cd backend/infrastructure
            npm ci
          else
            echo "Missing backend/infrastructure/package.json"
          fi

      # `cdk diff` synthesizes with asset bundling. The arm64 image needs
      # QEMU on an x86-64 runner.
      - name: Set up QEMU for arm64 Lambda bundling
        if: steps.account.outputs.ready == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Check CDK Bootstrap status
        if: steps.account.outputs.ready == 'true'
        run: |
          QUALIFIER="${CDK_BOOTSTRAP_QUALIFIER:-hnb659fds}"
          SSM_PARAM="/cdk-bootstrap/${QUALIFIER}/version"
          echo "Checking for CDK Bootstrap in the configured account, region $AWS_REGION..."
          if ! aws ssm get-parameter --name "$SSM_PARAM" --query "Parameter.Value" --output text 2>/dev/null; then
            echo ""
            echo "::error::CDK Bootstrap not found or not accessible."
            echo "::error::The SSM parameter '$SSM_PARAM' could not be read."
            echo ""
            echo "Possible causes:"
            echo "  1. CDK Bootstrap missing in this account and region for qualifier $QUALIFIER"
            echo "  2. Permission denied: GitHubActionsRole needs ssm:GetParameter on /cdk-bootstrap/*"
            echo "  3. Wrong region: Verify AWS_REGION matches the bootstrapped region"
            echo ""
            echo "If bootstrap was run from another repo, ensure GitHubActionsRole has:"
            echo "  - sts:AssumeRole on cdk-${QUALIFIER}-*-role-* resources"
            echo "  - ssm:GetParameter on /cdk-bootstrap/* parameters"
            echo ""
            exit 1
          fi
          echo "CDK Bootstrap found. Proceeding with diff..."
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}

      - name: Run CDK diff
        if: steps.account.outputs.ready == 'true'
        run: |
          if [ -f "backend/infrastructure/package.json" ]; then
            cd backend/infrastructure
            npx cdk acknowledge 34892 || true
            npm run build --if-present
            BACKEND_PARAM_ARGS=()
            ADMIN_WEB_PARAM_ARGS=()
            PUBLIC_WWW_PARAM_ARGS=()
            resolve_param_file() {
              local path="$1"
              if [ -z "$path" ]; then
                return 1
              fi
              if [ -f "$path" ]; then
                echo "$path"
                return 0
              fi
              if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
                echo "$GITHUB_WORKSPACE/$path"
                return 0
              fi
              return 1
            }
            if [ -n "${CDK_PARAM_FILE:-}" ]; then
              RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
              if [ -n "$RESOLVED_PARAM_FILE" ]; then
                # shellcheck source=../../scripts/deploy/cdk-params.sh
                source ../../scripts/deploy/cdk-params.sh
                cdk_load_param_args "$RESOLVED_PARAM_FILE"
              else
                echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
                exit 1
              fi
            fi
            PARAM_ARGS=( "${BACKEND_PARAM_ARGS[@]}" "${ADMIN_WEB_PARAM_ARGS[@]}" "${PUBLIC_WWW_PARAM_ARGS[@]}" )
            STACK_ARGS=()
            if [ -n "${CDK_STACKS:-}" ]; then
              IFS=$', \n\t' read -r -a STACK_LIST <<< "$CDK_STACKS"
              for stack in "${STACK_LIST[@]}"; do
                trimmed="${stack#"${stack%%[![:space:]]*}"}"
                trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
                if [ -n "$trimmed" ]; then
                  STACK_ARGS+=("$trimmed")
                fi
              done
            fi
            if [ ${#STACK_ARGS[@]} -eq 0 ]; then
              STACK_ARGS=(findingalpha-public-www findingalpha findingalpha-admin-web)
            fi
            set +e
            npx cdk diff --no-color "${PARAM_ARGS[@]}" "${STACK_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/cdk-diff.txt"
            diff_status="${PIPESTATUS[0]}"
            set -e
            # The account step already skipped this job when the secret is empty.
            # Strip the account id before the job summary.
            sed "s/${AWS_ACCOUNT_ID}/***/g" "$RUNNER_TEMP/cdk-diff.txt" > "$RUNNER_TEMP/cdk-diff-summary.txt"
            {
              echo "### CDK diff"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/cdk-diff-summary.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$diff_status"
          else
            echo "Missing backend/infrastructure/package.json"
          fi
        env:
          CDK_STACKS: ${{ inputs.stacks }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
