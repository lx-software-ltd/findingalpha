name: CDK Diff

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/cdk-diff.yml"
  workflow_dispatch:
    inputs:
      stacks:
        description: "Optional space/comma-separated CDK stack names"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cdk-diff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diff:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    env:
      CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse the deploy role on a pull request
        if: github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_NAME == 'GitHubActionsRole'
        run: |
          echo "::error::AWS_DIFF_ROLE_NAME must name a read-only role. A pull request does not assume GitHubActionsRole."
          exit 1

      - name: Configure AWS credentials
        id: aws
        if: github.event_name != 'pull_request' || vars.AWS_DIFF_ROLE_NAME != ''
        uses: lx-software-ltd/actions/aws-oidc@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}
          role-name: ${{ github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_NAME || 'GitHubActionsRole' }}
          required: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

      - name: Note when a pull request diff did not run
        if: github.event_name == 'pull_request' && steps.aws.outputs.ready != 'true'
        run: |
          echo "::warning::This pull request did not assume a role. Set AWS_DIFF_ROLE_NAME to a read-only role that trusts only pull_request. GitHubActionsRole is not assumed from a pull request."

      - name: Set up Node.js
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/setup-node@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      # `cdk diff` synthesizes with asset bundling. The arm64 image needs
      # QEMU on an x86-64 runner.
      - name: Set up QEMU for arm64 Lambda bundling
        if: steps.aws.outputs.ready == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Check CDK Bootstrap status
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/cdk-bootstrap-check@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Prepare CDK diff
        id: prep
        if: steps.aws.outputs.ready == 'true'
        run: |
          if [ ! -f "backend/infrastructure/package.json" ]; then
            echo "::warning::Missing backend/infrastructure/package.json"
            echo "Missing backend/infrastructure/package.json"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd backend/infrastructure
          npx cdk acknowledge 34892 || true
          npm run build --if-present
          BACKEND_PARAM_ARGS=()
          ADMIN_WEB_PARAM_ARGS=()
          PUBLIC_WWW_PARAM_ARGS=()
          resolve_param_file() {
            local path="$1"
            if [ -z "$path" ]; then
              return 1
            fi
            if [ -f "$path" ]; then
              echo "$path"
              return 0
            fi
            if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "$GITHUB_WORKSPACE/$path"
              return 0
            fi
            return 1
          }
          if [ -n "${CDK_PARAM_FILE:-}" ]; then
            RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
            if [ -n "$RESOLVED_PARAM_FILE" ]; then
              # shellcheck source=../../scripts/deploy/cdk-params.sh
              source ../../scripts/deploy/cdk-params.sh
              cdk_load_param_args "$RESOLVED_PARAM_FILE"
            else
              echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
              exit 1
            fi
          fi
          PARAM_ARGS=( "${BACKEND_PARAM_ARGS[@]}" "${ADMIN_WEB_PARAM_ARGS[@]}" "${PUBLIC_WWW_PARAM_ARGS[@]}" )
          if [ ${#PARAM_ARGS[@]} -gt 0 ]; then
            printf '%s\0' "${PARAM_ARGS[@]}" > "$RUNNER_TEMP/cdk-diff-args"
          else
            : > "$RUNNER_TEMP/cdk-diff-args"
          fi
          STACK_ARGS=()
          if [ -n "${CDK_STACKS:-}" ]; then
            IFS=$', \n\t' read -r -a STACK_LIST <<< "$CDK_STACKS"
            for stack in "${STACK_LIST[@]}"; do
              trimmed="${stack#"${stack%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$trimmed" ]; then
                STACK_ARGS+=("$trimmed")
              fi
            done
          fi
          if [ ${#STACK_ARGS[@]} -eq 0 ]; then
            STACK_ARGS=(findingalpha-public-www findingalpha findingalpha-admin-web)
          fi
          {
            echo "run=true"
            echo "stacks=${STACK_ARGS[*]}"
          } >> "$GITHUB_OUTPUT"
        env:
          CDK_STACKS: ${{ inputs.stacks }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}

      - name: Build the Cognito connect origin
        if: steps.aws.outputs.ready == 'true' && steps.prep.outputs.run == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ secrets.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path

          region = os.environ.get("AWS_REGION", "")
          if not region:
              raise SystemExit("AWS_REGION is required to build the Cognito prefix origin for CSP.")
          prefix_origin = f"https://findingalpha-admin-auth.auth.{region}.amazoncognito.com"
          domain = os.environ.get("P_COGNITO_DOMAIN", "")
          cert = os.environ.get("P_COGNITO_CERT", "")
          if domain and cert:
              origin = prefix_origin + " https://" + domain
          else:
              origin = prefix_origin
          env_path = Path(os.environ["GITHUB_ENV"])
          existing = env_path.read_text(encoding="utf-8")
          if existing and not existing.endswith("\n"):
              existing += "\n"
          env_path.write_text(existing + f"P_CSP_ORIGIN={origin}\n", encoding="utf-8")
          PY

      - name: Run CDK diff
        if: steps.aws.outputs.ready == 'true' && steps.prep.outputs.run == 'true'
        uses: lx-software-ltd/actions/cdk-diff@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          stacks: ${{ steps.prep.outputs.stacks }}
          plan-file: backend/infrastructure/cdk-plan.json
          args-file: ${{ runner.temp }}/cdk-diff-args
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
        env:
          P_ADMIN_DOMAIN: ${{ vars.ADMIN_WEB_DOMAIN_NAME }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST || vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_MAIL_DOMAIN: ${{ vars.MAIL_SENDING_DOMAIN }}
          P_BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT_EMAIL || vars.BRIEF_RECIPIENT_EMAIL }}
          P_SEC_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          P_CERT_ARN: ${{ secrets.ADMIN_WEB_CERTIFICATE_ARN || vars.ADMIN_WEB_CERTIFICATE_ARN }}
          P_API_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN_NAME }}
          P_API_CERT: ${{ secrets.API_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ secrets.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_WAF_ARN: ${{ vars.ADMIN_WAF_WEB_ACL_ARN }}
          P_PUBLIC_DOMAIN: ${{ vars.PUBLIC_WWW_DOMAIN_NAME }}
          P_PUBLIC_CERT_ARN: ${{ secrets.PUBLIC_WWW_CERTIFICATE_ARN || vars.PUBLIC_WWW_CERTIFICATE_ARN }}
          P_PUBLIC_WAF_ARN: ${{ vars.PUBLIC_WWW_WAF_WEB_ACL_ARN }}
