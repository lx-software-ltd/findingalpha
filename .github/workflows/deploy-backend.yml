name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "contracts/**"
      - "!contracts/roadmap.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # The production environment should also limit branches to main.
    # This job refuses every other ref even if that setting is open.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Require deploy settings
        env:
          P_ADMIN_DOMAIN: ${{ vars.ADMIN_WEB_DOMAIN_NAME }}
          P_CERT_ARN: ${{ vars.ADMIN_WEB_CERTIFICATE_ARN }}
          P_PUBLIC_DOMAIN: ${{ vars.PUBLIC_WWW_DOMAIN_NAME }}
          P_PUBLIC_CERT_ARN: ${{ vars.PUBLIC_WWW_CERTIFICATE_ARN }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST || vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT_EMAIL || vars.BRIEF_RECIPIENT_EMAIL }}
          P_SEC_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          ALLOWLIST_FROM_VARIABLE: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST == '' && vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST != '' }}
          BRIEF_FROM_VARIABLE: ${{ secrets.BRIEF_RECIPIENT_EMAIL == '' && vars.BRIEF_RECIPIENT_EMAIL != '' }}
          SEC_FROM_VARIABLE: ${{ secrets.SEC_CONTACT_EMAIL == '' && vars.SEC_CONTACT_EMAIL != '' }}
        run: |
          # This step's settings block is printed before any mask. Register
          # the values now so later steps show *** instead of repeating them.
          mask_list() {
            local raw="$1"
            local part trimmed
            local -a parts
            if [ -z "$raw" ]; then
              return 0
            fi
            echo "::add-mask::${raw}"
            IFS=',' read -ra parts <<< "$raw"
            for part in "${parts[@]}"; do
              trimmed="${part#"${part%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$trimmed" ]; then
                echo "::add-mask::${trimmed}"
              fi
            done
          }
          warn_if_variable() {
            if [ "$1" = "true" ]; then
              echo "::warning::$2 is read from a variable, so this log shows it. Set the secret and delete the variable."
            fi
          }
          mask_list "${P_ACCOUNT_ID}"
          mask_list "${P_EMAIL_ALLOWLIST}"
          mask_list "${P_BRIEF_RECIPIENT}"
          mask_list "${P_SEC_CONTACT}"
          warn_if_variable "${ALLOWLIST_FROM_VARIABLE}" "ADMIN_FEDERATED_EMAIL_ALLOWLIST"
          warn_if_variable "${BRIEF_FROM_VARIABLE}" "BRIEF_RECIPIENT_EMAIL"
          warn_if_variable "${SEC_FROM_VARIABLE}" "SEC_CONTACT_EMAIL"
          if [ -z "${P_ADMIN_DOMAIN}" ] || [ -z "${P_CERT_ARN}" ]; then
            echo "::error::Set ADMIN_WEB_DOMAIN_NAME and ADMIN_WEB_CERTIFICATE_ARN on the production environment before deploying."
            exit 1
          fi
          if [ -z "${P_PUBLIC_DOMAIN}" ] || [ -z "${P_PUBLIC_CERT_ARN}" ]; then
            echo "::notice::PUBLIC_WWW_DOMAIN_NAME or PUBLIC_WWW_CERTIFICATE_ARN is unset; findingalpha-public-www will be skipped."
          fi
          if [ -z "${P_ACCOUNT_ID}" ]; then
            echo "::error::Set AWS_ACCOUNT_ID as a repository secret before deploying."
            exit 1
          fi
          if [ -z "${P_EMAIL_ALLOWLIST}" ]; then
            echo "::error::Set ADMIN_FEDERATED_EMAIL_ALLOWLIST as a production secret or a variable before deploying."
            exit 1
          fi
          if { [ -n "${P_COGNITO_DOMAIN}" ] && [ -z "${P_COGNITO_CERT}" ]; } || \
             { [ -z "${P_COGNITO_DOMAIN}" ] && [ -n "${P_COGNITO_CERT}" ]; }; then
            echo "::error::Set both ADMIN_COGNITO_CUSTOM_DOMAIN_NAME and ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN, or leave both empty."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@e6be2629d7206b0d5c079662f364772bc816acc1 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Install CDK dependencies
        run: |
          if [ ! -f "backend/infrastructure/package.json" ]; then
            echo "Missing backend/infrastructure/package.json"
            exit 1
          fi
          cd backend/infrastructure
          npm ci

      - name: Build CDK app
        run: |
          cd backend/infrastructure
          npm run build --if-present

      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Check CDK Bootstrap status
        run: |
          QUALIFIER="${CDK_BOOTSTRAP_QUALIFIER:-hnb659fds}"
          SSM_PARAM="/cdk-bootstrap/${QUALIFIER}/version"
          echo "Checking for CDK Bootstrap in the configured account, region $AWS_REGION (qualifier=$QUALIFIER)..."
          if ! aws ssm get-parameter --name "$SSM_PARAM" --query "Parameter.Value" --output text 2>/dev/null; then
            echo ""
            echo "::error::CDK Bootstrap not found or not accessible."
            echo "::error::The SSM parameter '$SSM_PARAM' could not be read."
            echo ""
            echo "Possible causes:"
            echo "  1. CDK Bootstrap missing in this account and region for qualifier $QUALIFIER"
            echo "  2. Permission denied: GitHubActionsRole needs ssm:GetParameter on /cdk-bootstrap/*"
            echo "  3. Wrong region: Verify AWS_REGION matches the bootstrapped region"
            echo ""
            echo "If you use a custom bootstrap qualifier, set GitHub variable CDK_BOOTSTRAP_QUALIFIER"
            echo "to match this repo's bin/app.ts / CDK CLI."
            echo ""
            echo "If CDK Bootstrap exists but this job still fails:"
            echo "  - GitHubActionsRole needs sts:AssumeRole on the cdk-${QUALIFIER} roles in this account"
            echo "  - CDK deploy/file-publish roles must trust GitHubActionsRole (or your org's deploy principal)"
            echo ""
            exit 1
          fi
          echo "CDK Bootstrap found (version: $(aws ssm get-parameter --name "$SSM_PARAM" --query "Parameter.Value" --output text)). Proceeding with deployment..."
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}

      - name: Checkout the pinned deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lx-software-ltd/actions
          ref: e6be2629d7206b0d5c079662f364772bc816acc1
          path: .actions-pin

      - name: Compare the dry run with the current deploy
        continue-on-error: true
        working-directory: backend/infrastructure
        env:
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_ADMIN_DOMAIN: ${{ vars.ADMIN_WEB_DOMAIN_NAME }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          # Secret wins. The settings step masks a variable fallback for the rest of this job.
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST || vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_MAIL_DOMAIN: ${{ vars.MAIL_SENDING_DOMAIN }}
          P_BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT_EMAIL || vars.BRIEF_RECIPIENT_EMAIL }}
          P_SEC_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          P_CERT_ARN: ${{ vars.ADMIN_WEB_CERTIFICATE_ARN }}
          P_API_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN_NAME }}
          P_API_CERT: ${{ vars.API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_WAF_ARN: ${{ vars.ADMIN_WAF_WEB_ACL_ARN }}
          P_PUBLIC_DOMAIN: ${{ vars.PUBLIC_WWW_DOMAIN_NAME }}
          P_PUBLIC_CERT_ARN: ${{ vars.PUBLIC_WWW_CERTIFICATE_ARN }}
          P_PUBLIC_WAF_ARN: ${{ vars.PUBLIC_WWW_WAF_WEB_ACL_ARN }}
        run: |
          set -euo pipefail
          umask 077
          real_npx="$(command -v npx)"
          real_aws="$(command -v aws)"
          bindir="$RUNNER_TEMP/cdk-dry/bin"
          mkdir -p "$bindir"
          CURRENT_LOG="$RUNNER_TEMP/cdk-current.jsonl"
          ACTION_LOG="$RUNNER_TEMP/cdk-action.jsonl"
          rm -f "$CURRENT_LOG" "$ACTION_LOG"
          trap 'rm -f "$CURRENT_LOG" "$ACTION_LOG" "$RUNNER_TEMP/current-cdk.sh"' EXIT
          REAL_NPX="$real_npx" REAL_AWS="$real_aws" BINDIR="$bindir" python3 - << 'PY'
          import os
          from pathlib import Path

          bindir = Path(os.environ["BINDIR"])
          (bindir / "record.py").write_text(
              "import json, os, sys\n"
              'open(os.environ["DEPLOY_LOG"], "a", encoding="utf-8").write(json.dumps(sys.argv[1:]) + "\\n")\n'
          )
          npx = bindir / "npx"
          npx.write_text(
              "\n".join(
                  [
                      "#!/usr/bin/env bash",
                      "set -euo pipefail",
                      'real="${REAL_NPX:?}"',
                      'log="${DEPLOY_LOG:?}"',
                      'here="$(cd "$(dirname "$0")" && pwd)"',
                      'if [[ "${1:-}" == "cdk" && ( "${2:-}" == "deploy" || "${2:-}" == "destroy" || "${2:-}" == "bootstrap" ) ]]; then',
                      '  DEPLOY_LOG="$log" python3 "$here/record.py" npx "$@"',
                      "  exit 0",
                      "fi",
                      'exec "$real" "$@"',
                      "",
                  ]
              )
          )
          npx.chmod(0o755)
          aws = bindir / "aws"
          aws.write_text(
              "\n".join(
                  [
                      "#!/usr/bin/env bash",
                      "set -euo pipefail",
                      'real="${REAL_AWS:?}"',
                      'log="${DEPLOY_LOG:?}"',
                      'here="$(cd "$(dirname "$0")" && pwd)"',
                      'if [[ "${1:-}" == "cloudformation" ]]; then',
                      '  case "${2:-}" in',
                      "    describe-*|list-*|get-*)",
                      '      exec "$real" "$@"',
                      "      ;;",
                      "  esac",
                      "fi",
                      'DEPLOY_LOG="$log" python3 "$here/record.py" aws "$@"',
                      "exit 0",
                      "",
                  ]
              )
          )
          aws.chmod(0o755)
          PY
          : > "$CURRENT_LOG"
          REAL_NPX=/bin/false REAL_AWS=/bin/false DEPLOY_LOG="$CURRENT_LOG" PATH="$bindir:$PATH" \
            npx cdk deploy --require-approval never sentinel-stack
          REAL_NPX=/bin/false REAL_AWS=/bin/false DEPLOY_LOG="$CURRENT_LOG" PATH="$bindir:$PATH" \
            npx cdk destroy --force sentinel-stack
          REAL_NPX=/bin/false REAL_AWS=/bin/false DEPLOY_LOG="$CURRENT_LOG" PATH="$bindir:$PATH" \
            aws cloudformation continue-update-rollback --stack-name sentinel-stack
          LOG="$CURRENT_LOG" python3 - << 'PY'
          import json as _json
          import os
          from pathlib import Path

          rows = [_json.loads(line) for line in Path(os.environ["LOG"]).read_text(encoding="utf-8").splitlines()]
          cdk = [row for row in rows if row[:1] == ["npx"]]
          aws = [row for row in rows if row[:1] == ["aws"]]
          if [row[1:3] for row in cdk] != [["cdk", "deploy"], ["cdk", "destroy"]]:
              raise SystemExit("npx stub executed or failed to record")
          if len(aws) != 1 or aws[0][:3] != ["aws", "cloudformation", "continue-update-rollback"]:
              raise SystemExit("aws stub executed a CloudFormation write")
          PY
          : > "$CURRENT_LOG"
          export REAL_NPX="$real_npx"
          export REAL_AWS="$real_aws"
          export PATH="$bindir:$PATH"
          STEP_NAME="Deploy CDK stacks" \
            WORKFLOW="$GITHUB_WORKSPACE/.github/workflows/deploy-backend.yml" \
            OUT="$RUNNER_TEMP/current-cdk.sh" \
            python3 - << 'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["WORKFLOW"]).read_text(encoding="utf-8")
          lines = text.splitlines()
          name = os.environ["STEP_NAME"]
          start = None
          for index, line in enumerate(lines):
              if line == f"      - name: {name}":
                  start = index
                  break
          if start is None:
              raise SystemExit("deploy step not found")
          end = len(lines)
          for index in range(start + 1, len(lines)):
              if lines[index].startswith("      - ") or (
                  lines[index].strip() and not lines[index].startswith(" ")
              ):
                  end = index
                  break
          step = lines[start:end]
          body = None
          for index, line in enumerate(step):
              if line != "        run: |":
                  continue
              kept = []
              for later in step[index + 1 :]:
                  if later.strip() == "":
                      kept.append("")
                      continue
                  if later.startswith("          "):
                      kept.append(later[10:])
                      continue
                  break
              body = "\n".join(kept).rstrip() + "\n"
              break
          if body is None or "npx cdk deploy" not in body:
              raise SystemExit("refusing to run a step that is not the current cdk deploy")
          if "REAL_NPX" in body or "cdk_deploy.py" in body:
              raise SystemExit("refusing to run the comparison step")
          Path(os.environ["OUT"]).write_text(body, encoding="utf-8")
          PY
          export DEPLOY_LOG="$CURRENT_LOG"
          bash "$RUNNER_TEMP/current-cdk.sh" || true
          export DEPLOY_LOG="$ACTION_LOG"
          python3 - << 'PY' || true
          import importlib.util
          import os
          import sys

          import json as _json
          import os

          def build_plan():
              region = os.environ.get("AWS_REGION", "")
              if not region:
                  raise SystemExit("AWS_REGION is required to build the Cognito prefix origin for CSP.")
              prefix_origin = f"https://findingalpha-admin-auth.auth.{region}.amazoncognito.com"
              domain = os.environ.get("P_COGNITO_DOMAIN", "")
              cert = os.environ.get("P_COGNITO_CERT", "")
              if domain and cert:
                  origin = prefix_origin + " https://" + domain
              else:
                  origin = prefix_origin

              def pair(name, value):
                  return ["--parameters", f"{name}={value}"]

              admin = []
              admin += pair("findingalpha:AdminWebDomainName", os.environ.get("P_ADMIN_DOMAIN", ""))
              admin += pair("findingalpha:GoogleClientId", os.environ.get("P_GOOGLE_CLIENT_ID", ""))
              admin += pair("findingalpha:GoogleClientSecret", os.environ.get("P_GOOGLE_CLIENT_SECRET", ""))
              admin += pair("findingalpha:AdminFederatedEmailAllowlist", os.environ.get("P_EMAIL_ALLOWLIST", ""))
              admin += pair("findingalpha:MailSendingDomain", os.environ.get("P_MAIL_DOMAIN", ""))
              admin += pair("findingalpha:BriefRecipientEmail", os.environ.get("P_BRIEF_RECIPIENT", ""))
              admin += pair("findingalpha:SecContactEmail", os.environ.get("P_SEC_CONTACT", ""))
              admin += pair("findingalpha-admin-web:AdminWebDomainName", os.environ.get("P_ADMIN_DOMAIN", ""))
              admin += pair("findingalpha:ApiCustomDomainName", os.environ.get("P_API_DOMAIN", ""))
              admin += pair("findingalpha:ApiCustomDomainCertificateArn", os.environ.get("P_API_CERT", ""))
              admin += pair("findingalpha:CognitoCustomDomainName", domain)
              admin += pair("findingalpha:CognitoCustomDomainCertificateArn", cert)
              admin += pair("findingalpha-admin-web:AdminWebCertificateArn", os.environ.get("P_CERT_ARN", ""))
              admin += pair("findingalpha-admin-web:CspCognitoConnectOrigin", origin)
              admin += pair("findingalpha-admin-web:WafWebAclArn", os.environ.get("P_WAF_ARN", ""))
              public = []
              public += pair("findingalpha-public-www:PublicWebsiteDomainName", os.environ.get("P_PUBLIC_DOMAIN", ""))
              public += pair("findingalpha-public-www:PublicWebsiteCertificateArn", os.environ.get("P_PUBLIC_CERT_ARN", ""))
              public += pair("findingalpha-public-www:WafWebAclArn", os.environ.get("P_PUBLIC_WAF_ARN", ""))
              return {
                  "groups": [
                      {
                          "stacks": ["findingalpha", "findingalpha-admin-web"],
                          "prefixes": ["findingalpha:", "findingalpha-admin-web:"],
                          "extra-args": admin,
                      },
                      {
                          "stacks": ["findingalpha-public-www"],
                          "prefixes": ["findingalpha-public-www:"],
                          "when-all-env": ["P_PUBLIC_DOMAIN", "P_PUBLIC_CERT_ARN"],
                          "extra-args": public,
                      },
                  ]
              }

          def configure() -> None:
              os.environ["PLAN"] = _json.dumps(build_plan())
              os.environ["PARAM_FILE"] = os.environ.get("CDK_PARAM_FILE", "")
              os.environ["WORKING_DIRECTORY"] = ""
              os.environ["FORMAT"] = "prefixed-json"
              os.environ["ATTEMPTS"] = "1"
              os.environ["NO_NOTICES"] = "false"
              os.environ["PASS_EMPTY"] = ""
              os.environ["ESCAPE_NEWLINES"] = "false"
              os.environ["SKIP_RESOURCE"] = ""
              os.environ["ROLLBACK_MATCH"] = "is in UPDATE_ROLLBACK_FAILED state and can not be updated"
              seed = os.environ.get("RUN_SEED_DATA", "false").strip().lower()
              os.environ["RUN_SEED"] = "true" if seed == "true" else "false"
              destroy = os.environ.get("DESTROY_BEFORE_DEPLOY", "false").strip().lower()
              os.environ["DESTROY"] = "true" if destroy == "true" else "false"

          configure()
          path = os.environ["GITHUB_WORKSPACE"] + "/.actions-pin/cdk-deploy/cdk_deploy.py"
          spec = importlib.util.spec_from_file_location("cdk_deploy", path)
          if spec is None or spec.loader is None:
              raise SystemExit("cdk_deploy.py is not in the pinned checkout")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          raise SystemExit(module.main())
          PY
          CURRENT="$CURRENT_LOG" ACTION="$ACTION_LOG" python3 - << 'PY'
          import json as _json
          import os
          import re
          import sys
          from pathlib import Path

          account = re.compile(r"\b\d{12}\b")

          def load(path):
              text = Path(path).read_text(encoding="utf-8")
              return [_json.loads(line) for line in text.splitlines() if line.strip()]

          def signature(argv):
              flags = []
              params = []
              positional = []
              index = 0
              while index < len(argv):
                  token = argv[index]
                  if token == "--parameters" and index + 1 < len(argv):
                      params.append(argv[index + 1])
                      index += 2
                      continue
                  if token.startswith("--") and index + 1 < len(argv) and not argv[index + 1].startswith("-"):
                      flags.append((token, argv[index + 1]))
                      index += 2
                      continue
                  if token.startswith("-"):
                      flags.append((token, ""))
                      index += 1
                      continue
                  positional.append(token)
                  index += 1
              if len(positional) < 3 or positional[1] != "cdk":
                  return None
              if positional[2] not in {"deploy", "destroy"}:
                  return None
              return (positional[2], tuple(positional[3:]), tuple(sorted(flags)), tuple(sorted(params)))

          def keys(params):
              return [item.split("=", 1)[0] for item in params]

          def show(label, sig):
              command, stacks, flags, params = sig
              flag_text = " ".join(flag + (" " + value if value else "") for flag, value in flags)
              print(
                  account.sub("************", f"{label}: cdk {command} {flag_text} stacks {' '.join(stacks)}"),
                  file=sys.stderr,
              )
              print(f"{label} parameters: {', '.join(keys(params))}", file=sys.stderr)

          current = [item for item in (signature(row) for row in load(os.environ["CURRENT"])) if item]
          action = [item for item in (signature(row) for row in load(os.environ["ACTION"])) if item]
          if not current or current != action:
              print("planned CDK changes differ", file=sys.stderr)
              for index in range(max(len(current), len(action))):
                  left = current[index] if index < len(current) else None
                  right = action[index] if index < len(action) else None
                  if left == right:
                      continue
                  if left is not None:
                      show("current", left)
                  if right is not None:
                      show("action", right)
                  if left is not None and right is not None:
                      left_values = {item.split("=", 1)[0]: item.split("=", 1)[1] for item in left[3]}
                      right_values = {item.split("=", 1)[0]: item.split("=", 1)[1] for item in right[3]}
                      for key in sorted(set(left_values) & set(right_values)):
                          if left_values[key] != right_values[key]:
                              print(f"parameter value differs for {key}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Dry run matches the current deploy ({len(current)} planned CDK changes)")
          PY

      - name: Deploy CDK stacks
        working-directory: backend/infrastructure
        env:
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_ADMIN_DOMAIN: ${{ vars.ADMIN_WEB_DOMAIN_NAME }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          # Secret wins. The settings step masks a variable fallback for the rest of this job.
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST || vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_MAIL_DOMAIN: ${{ vars.MAIL_SENDING_DOMAIN }}
          P_BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT_EMAIL || vars.BRIEF_RECIPIENT_EMAIL }}
          P_SEC_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          P_CERT_ARN: ${{ vars.ADMIN_WEB_CERTIFICATE_ARN }}
          P_API_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN_NAME }}
          P_API_CERT: ${{ vars.API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_WAF_ARN: ${{ vars.ADMIN_WAF_WEB_ACL_ARN }}
          P_PUBLIC_DOMAIN: ${{ vars.PUBLIC_WWW_DOMAIN_NAME }}
          P_PUBLIC_CERT_ARN: ${{ vars.PUBLIC_WWW_CERTIFICATE_ARN }}
          P_PUBLIC_WAF_ARN: ${{ vars.PUBLIC_WWW_WAF_WEB_ACL_ARN }}
        run: |
          set -eo pipefail
          npx cdk acknowledge 34892 || true

          BACKEND_PARAM_ARGS=()
          ADMIN_WEB_PARAM_ARGS=()
          PUBLIC_WWW_PARAM_ARGS=()
          resolve_param_file() {
            local path="$1"
            if [ -z "$path" ]; then
              return 1
            fi
            if [ -f "$path" ]; then
              echo "$path"
              return 0
            fi
            if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "$GITHUB_WORKSPACE/$path"
              return 0
            fi
            return 1
          }
          if [ -n "${CDK_PARAM_FILE:-}" ]; then
            RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
            if [ -n "$RESOLVED_PARAM_FILE" ]; then
              # shellcheck source=../../scripts/deploy/cdk-params.sh
              source ../../scripts/deploy/cdk-params.sh
              cdk_load_param_args "$RESOLVED_PARAM_FILE"
            else
              echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
              exit 1
            fi
          fi

          # CognitoDomain (SPA) is conditional: custom when both vars are set,
          # else the prefix. CSP always allows the prefix, and when both
          # custom-domain vars are set also https://auth.<domain>.
          # Passed as a parameter; CognitoDomain has no exportName.
          COGNITO_PREFIX="findingalpha-admin-auth"
          if [ -z "${AWS_REGION}" ]; then
            echo "::error::AWS_REGION is required to build the Cognito prefix origin for CSP."
            exit 1
          fi
          COGNITO_PREFIX_ORIGIN="https://${COGNITO_PREFIX}.auth.${AWS_REGION}.amazoncognito.com"
          if [ -n "${P_COGNITO_DOMAIN}" ] && [ -n "${P_COGNITO_CERT}" ]; then
            COGNITO_ORIGIN="${COGNITO_PREFIX_ORIGIN} https://${P_COGNITO_DOMAIN}"
          else
            COGNITO_ORIGIN="${COGNITO_PREFIX_ORIGIN}"
          fi

          # Backend + admin SPA first so a public-www failure cannot block them.
          # Public www has no cross-stack imports; deploy it last when vars are set.
          npx cdk deploy --require-approval never \
            "${BACKEND_PARAM_ARGS[@]}" "${ADMIN_WEB_PARAM_ARGS[@]}" \
            --parameters "findingalpha:AdminWebDomainName=${P_ADMIN_DOMAIN}" \
            --parameters "findingalpha:GoogleClientId=${P_GOOGLE_CLIENT_ID}" \
            --parameters "findingalpha:GoogleClientSecret=${P_GOOGLE_CLIENT_SECRET}" \
            --parameters "findingalpha:AdminFederatedEmailAllowlist=${P_EMAIL_ALLOWLIST}" \
            --parameters "findingalpha:MailSendingDomain=${P_MAIL_DOMAIN}" \
            --parameters "findingalpha:BriefRecipientEmail=${P_BRIEF_RECIPIENT}" \
            --parameters "findingalpha:SecContactEmail=${P_SEC_CONTACT}" \
            --parameters "findingalpha-admin-web:AdminWebDomainName=${P_ADMIN_DOMAIN}" \
            --parameters "findingalpha:ApiCustomDomainName=${P_API_DOMAIN}" \
            --parameters "findingalpha:ApiCustomDomainCertificateArn=${P_API_CERT}" \
            --parameters "findingalpha:CognitoCustomDomainName=${P_COGNITO_DOMAIN}" \
            --parameters "findingalpha:CognitoCustomDomainCertificateArn=${P_COGNITO_CERT}" \
            --parameters "findingalpha-admin-web:AdminWebCertificateArn=${P_CERT_ARN}" \
            --parameters "findingalpha-admin-web:CspCognitoConnectOrigin=${COGNITO_ORIGIN}" \
            --parameters "findingalpha-admin-web:WafWebAclArn=${P_WAF_ARN}" \
            findingalpha findingalpha-admin-web

          if [ -n "${P_PUBLIC_DOMAIN}" ] && [ -n "${P_PUBLIC_CERT_ARN}" ]; then
            npx cdk deploy --require-approval never \
              "${PUBLIC_WWW_PARAM_ARGS[@]}" \
              --parameters "findingalpha-public-www:PublicWebsiteDomainName=${P_PUBLIC_DOMAIN}" \
              --parameters "findingalpha-public-www:PublicWebsiteCertificateArn=${P_PUBLIC_CERT_ARN}" \
              --parameters "findingalpha-public-www:WafWebAclArn=${P_PUBLIC_WAF_ARN}" \
              findingalpha-public-www
          else
            echo "::notice::Skipping findingalpha-public-www (PUBLIC_WWW_DOMAIN_NAME or PUBLIC_WWW_CERTIFICATE_ARN unset)."
          fi
