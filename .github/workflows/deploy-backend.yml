name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  push:
    branches: [main]
    paths:
      - "backend/infrastructure/**"
      - "backend/lambda/**"
      - "contracts/**"
      - "!contracts/roadmap.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      cdk_stacks:
        description: CDK stacks to deploy. Empty deploys every stack in the plan.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    # The production environment should also limit branches to main.
    # This job refuses every other ref even if that setting is open.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Set up QEMU for arm64 Lambda bundling
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Check CDK bootstrap
        uses: lx-software-ltd/actions/cdk-bootstrap-check@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Prepare CDK app
        id: prep
        run: bash scripts/deploy/cdk-prepare.sh deploy
        env:
          P_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ALLOWLIST_FROM_VARIABLE: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST == '' && vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST != '' }}
          BRIEF_FROM_VARIABLE: ${{ secrets.BRIEF_RECIPIENT_EMAIL == '' && vars.BRIEF_RECIPIENT_EMAIL != '' }}
          SEC_FROM_VARIABLE: ${{ secrets.SEC_CONTACT_EMAIL == '' && vars.SEC_CONTACT_EMAIL != '' }}
          ADMIN_CERT_FROM_VARIABLE: ${{ secrets.ADMIN_WEB_CERTIFICATE_ARN == '' && vars.ADMIN_WEB_CERTIFICATE_ARN != '' }}
          PUBLIC_CERT_FROM_VARIABLE: ${{ secrets.PUBLIC_WWW_CERTIFICATE_ARN == '' && vars.PUBLIC_WWW_CERTIFICATE_ARN != '' }}
          COGNITO_CERT_FROM_VARIABLE: ${{ secrets.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN == '' && vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN != '' }}
          API_CERT_FROM_VARIABLE: ${{ secrets.API_CUSTOM_DOMAIN_CERTIFICATE_ARN == '' && vars.API_CUSTOM_DOMAIN_CERTIFICATE_ARN != '' }}
          CDK_STACKS: ${{ inputs.cdk_stacks }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_ADMIN_DOMAIN: ${{ vars.ADMIN_WEB_DOMAIN_NAME }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          # Secret wins. The settings step masks a variable fallback for the rest of this job.
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST || vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_MAIL_DOMAIN: ${{ vars.MAIL_SENDING_DOMAIN }}
          P_BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT_EMAIL || vars.BRIEF_RECIPIENT_EMAIL }}
          P_SEC_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          P_CERT_ARN: ${{ secrets.ADMIN_WEB_CERTIFICATE_ARN || vars.ADMIN_WEB_CERTIFICATE_ARN }}
          P_API_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN_NAME }}
          P_API_CERT: ${{ secrets.API_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ secrets.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_WAF_ARN: ${{ vars.ADMIN_WAF_WEB_ACL_ARN }}
          P_PUBLIC_DOMAIN: ${{ vars.PUBLIC_WWW_DOMAIN_NAME }}
          P_PUBLIC_CERT_ARN: ${{ secrets.PUBLIC_WWW_CERTIFICATE_ARN || vars.PUBLIC_WWW_CERTIFICATE_ARN }}
          P_PUBLIC_WAF_ARN: ${{ vars.PUBLIC_WWW_WAF_WEB_ACL_ARN }}

      - name: Deploy stacks
        uses: lx-software-ltd/actions/cdk-deploy@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          stacks: ${{ inputs.cdk_stacks }}
          plan-file: backend/infrastructure/cdk-plan.json
          param-file: ${{ vars.CDK_PARAM_FILE }}
          attempts: "3"
          region: ${{ vars.AWS_REGION }}
        env:
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          P_ADMIN_DOMAIN: ${{ vars.ADMIN_WEB_DOMAIN_NAME }}
          P_GOOGLE_CLIENT_ID: ${{ vars.ADMIN_GOOGLE_CLIENT_ID }}
          P_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET }}
          # Secret wins. The settings step masks a variable fallback for the rest of this job.
          P_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_FEDERATED_EMAIL_ALLOWLIST || vars.ADMIN_FEDERATED_EMAIL_ALLOWLIST }}
          P_MAIL_DOMAIN: ${{ vars.MAIL_SENDING_DOMAIN }}
          P_BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT_EMAIL || vars.BRIEF_RECIPIENT_EMAIL }}
          P_SEC_CONTACT: ${{ secrets.SEC_CONTACT_EMAIL || vars.SEC_CONTACT_EMAIL }}
          P_CERT_ARN: ${{ secrets.ADMIN_WEB_CERTIFICATE_ARN || vars.ADMIN_WEB_CERTIFICATE_ARN }}
          P_API_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN_NAME }}
          P_API_CERT: ${{ secrets.API_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          P_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_CUSTOM_DOMAIN_NAME }}
          P_COGNITO_CERT: ${{ secrets.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN || vars.ADMIN_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          P_WAF_ARN: ${{ vars.ADMIN_WAF_WEB_ACL_ARN }}
          P_PUBLIC_DOMAIN: ${{ vars.PUBLIC_WWW_DOMAIN_NAME }}
          P_PUBLIC_CERT_ARN: ${{ secrets.PUBLIC_WWW_CERTIFICATE_ARN || vars.PUBLIC_WWW_CERTIFICATE_ARN }}
          P_PUBLIC_WAF_ARN: ${{ vars.PUBLIC_WWW_WAF_WEB_ACL_ARN }}
